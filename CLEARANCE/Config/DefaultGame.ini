[/Script/UnrealEd.ProjectPackagingSettings]
; Gameplay level - opened by string from the menu, not referenced from
; LVL_MainMenu, so auto-cook wouldn't include it. - TripleA
+MapsToCook=(FilePath="/Game/LVL_Warton")
+MapsToCook=(FilePath="/Game/LVL_MainMenu")
; Oculus Interaction Prebuilts hard-references a sample widget path. - TripleA
+DirectoriesToAlwaysCook=(Path="/OculusInteractionSamples/Widgets")
; Force the entire game content tree - guarantees every BP subclass, widget,
; material and mesh cooks whether or not the cooker's soft-reference chaser
; picks it up. Slower cook, safer packaged build. - TripleA
+DirectoriesToAlwaysCook=(Path="/Game")
; Broken leftover template / marketplace content the cooker fatally asserts on
; (deleted classes, invalid skeletons, missing hand bindings). Not used at
; runtime; exclude to unblock the cook. Menu still references the base mesh
; asset in CommercialPlane/Meshes so that subfolder stays cookable - only
; the broken BP + Animations get excluded. - TripleA
+DirectoriesToNeverCook=(Path="/Game/XRFramework")
+DirectoriesToNeverCook=(Path="/Game/CommercialPlane/Blueprints")
+DirectoriesToNeverCook=(Path="/Game/CommercialPlane/Meshes/Animations")
+DirectoriesToNeverCook=(Path="/Game/FirstPerson")
+DirectoriesToNeverCook=(Path="/Game/Variant_Shooter")
+DirectoriesToNeverCook=(Path="/Game/Variant_Horror")

; Cesium's three-overlays material crashes the UE 5.7 Substrate shader
; preprocessor on cook (recursive #include -> stack overflow). Excluded
; since the sandbox tileset uses only two overlays, not three. - TripleA
+PackagesToNeverCook=(FilePath="/CesiumForUnreal/Materials/Instances/MI_CesiumThreeOverlaysAndClipping")

; Voice server folders staged via ClearanceSim.Build.cs RuntimeDependencies -
; the ini equivalents duplicated the copy step and caused packaging stalls. - TripleA
