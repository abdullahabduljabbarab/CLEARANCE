; VR performance knobs for the operator's Airport-test view. r.ViewDistanceScale
; halves the effective actor visibility range (distant city buildings cull
; earlier). vr.PixelDensity 0.85 renders each eye at 15% fewer pixels for a
; big GPU win, minor perceptible sharpness cost. Sky atmosphere sample count
; drops from 10/31 to 4/12 - the sky reads virtually identical but the
; per-frame raymarched atmosphere cost falls hard. - TripleA

[SystemSettings]
vr.PixelDensity=0.85
; Meta XR uses its own dynamic-resolution cvars, not the generic vr.PixelDensity.
; Both under 1.0 so we always render fewer pixels than native. Min=0.7 lets the
; runtime dip further when GPU is stressed. - TripleA
r.Oculus.DynamicResolution.PixelDensityMin=0.7
r.Oculus.DynamicResolution.PixelDensityMax=0.85
r.ViewDistanceScale=0.5
r.SkyAtmosphere.SampleCountMin=4
r.SkyAtmosphere.SampleCountMax=12
r.SkyAtmosphere.FastSkyLUT.SampleCountMin=2
r.SkyAtmosphere.FastSkyLUT.SampleCountMax=8

; LOD forcing for VR. StaticMeshLODDistanceScale 0.3 makes meshes drop to
; their lower LODs at 30% of the normal distance. foliage.LODDistanceScale
; does the same for the Foliage system if we migrate trees_C to it.
; SkeletalMeshLODBias 1 shifts skinned meshes (aircraft) one LOD lower
; globally. Aggressive but stereo VR at 72Hz needs it. - TripleA
r.StaticMeshLODDistanceScale=0.3
foliage.LODDistanceScale=0.3
r.SkeletalMeshLODBias=1

; Cesium photogrammetry needs a much bigger texture streaming pool than
; UE's default. Under-budget forces constant load/evict of tile textures
; per frame - massive perf hit on Game and GPU. 3000MB matches what most
; VR Cesium apps use. - TripleA
r.Streaming.PoolSize=3000
r.Streaming.LimitPoolSizeToVRAM=1

; Virtual Shadow Maps + non-Nanite Cesium meshes covering huge world area
; overwhelm the VSM marking queue. VSM is wrong shadow tech for VR anyway
; (heavy per-pixel cost). Fall back to standard cascade shadow maps. - TripleA
r.Shadow.Virtual.Enable=0
r.Shadow.Virtual.NonNaniteVSM=0

r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8

r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8

